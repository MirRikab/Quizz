<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Quiz Power BI - Qui suis-je ?</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f8fa;
      text-align: center;
      padding: 30px;
    }
    h1 {
      color: #f2b800;
    }
    .card {
      margin: 25px auto;
      width: 340px;
      position: relative;
    }
    canvas {
      border: 2px solid #444;
      touch-action: none; /* empêche le scroll tactile */
    }
  </style>
</head>
<body>
  <h1>🤔 Quiz Power BI - Qui suis-je ?</h1>
  <p>Grattez pour révéler la question et la réponse (bonne pratique) !</p>

  <div class="card">
    <canvas id="scratch1" width="340" height="100"></canvas>
  </div>
  <div class="card">
    <canvas id="scratch2" width="340" height="100"></canvas>
  </div>
  <div class="card">
    <canvas id="scratch3" width="340" height="100"></canvas>
  </div>
  <div class="card">
    <canvas id="scratch4" width="340" height="100"></canvas>
  </div>
  <div class="card">
    <canvas id="scratch5" width="340" height="100"></canvas>
  </div>
  <div class="card">
    <canvas id="scratch6" width="340" height="100"></canvas>
  </div>
  <div class="card">
    <canvas id="scratch7" width="340" height="100"></canvas>
  </div>
  <div class="card">
    <canvas id="scratch8" width="340" height="100"></canvas>
  </div>
  <div class="card">
    <canvas id="scratch9" width="340" height="100"></canvas>
  </div>
  <div class="card">
    <canvas id="scratch10" width="340" height="100"></canvas>
  </div>
  <div class="card">
    <canvas id="scratch11" width="340" height="100"></canvas>
  </div>
  <div class="card">
    <canvas id="scratch12" width="340" height="100"></canvas>
  </div>

  <script>
    const cards = [
      "1. Je nettoie et transforme les données avant de les présenter.\n👉 Power Query (Bonne pratique : toujours nettoyer vos données à la source)",
      "2. Je préfère les mesures aux colonnes calculées.\n👉 DAX (Bonne pratique : privilégier les mesures pour de meilleures performances)",
      "3. Je ressemble à une table Excel, mais j’ai plus de relations que vous sur LinkedIn.\n👉 Modèle de données (Bonne pratique : utilisez un modèle en étoile, pas spaghetti)",
      "4. Je vis dans le cloud, mais je ne pleut pas.\n👉 Power BI Service (Bonne pratique : sécurisez vos espaces de travail et vos partages)",
      "5. Je suis le bouton magique pour “tout voir d’un coup”.\n👉 Dashboard (Bonne pratique : limitez le nombre de visuels, restez clair)",
      "6. Quand je disparais, tout le monde panique : “Mais où sont mes filtres ?!”\n👉 Slicer (Bonne pratique : organisez vos filtres pour guider l’utilisateur)",
      "7. Je suis le donut préféré des data analysts (mais indigeste au-delà de 5 parts).\n👉 Graphique donut (Bonne pratique : max 5 catégories sinon passez à la barre/colonne)",
      "8. Je suis l’horloge interne de ton rapport. Si tu m’oublies, tes données restent figées.\n👉 Actualisation planifiée (Bonne pratique : surveillez vos refresh et planifiez intelligemment)",
      "9. Je décide si vos données sont joliment alignées… mais en bidirectionnel, je suis rarement une bonne idée.\n👉 Relations (Bonne pratique : privilégiez les relations unidirectionnelles, le bidirectionnel est à utiliser avec modération)",
      "10. Je rends vos rapports aussi faciles à naviguer que Netflix.\n👉 Signets & Onglets (Bonne pratique : rendez la navigation intuitive pour l’utilisateur)",
      "11. Je suis le petit disque que tu oublies toujours de cliquer avant de fermer ton rapport.\n👉 Bouton Enregistrer (Bonne pratique : sauvegardez régulièrement avant de publier 😅)",
      "12. J’arrive toujours en retard, mais quand je suis là, toutes tes données sont à jour.\n👉 Refresh planifié (Bonne pratique : configurez un horaire régulier pour éviter les mauvaises surprises)"
    ];

    function initScratch(canvasId, text) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext("2d");

      // Écrire la question + réponse sur le canvas
      ctx.fillStyle = "#000";
      ctx.font = "14px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const lines = text.split("\n");
      const lineHeight = 18;
      const startY = canvas.height / 2 - (lines.length-1) * lineHeight / 2;
      lines.forEach((line, i) => {
        ctx.fillText(line, canvas.width/2, startY + i*lineHeight);
      });

      // Couche grise au-dessus
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#bbb";
      ctx.fillRect(0,0,canvas.width,canvas.height);

      let isDrawing = false;

      function getXY(e){
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        return {x,y};
      }

      function startScratch(e){
        e.preventDefault();
        isDrawing = true;
        const {x,y} = getXY(e);
        ctx.globalCompositeOperation = "destination-out";
        ctx.beginPath();
        ctx.moveTo(x,y);
      }

      function drawScratch(e){
        if(!isDrawing) return;
        e.preventDefault();
        const {x,y} = getXY(e);
        ctx.lineTo(x,y);
        ctx.strokeStyle = "rgba(0,0,0,1)";
        ctx.lineWidth = 40; 
        ctx.lineCap = "round";
        ctx.stroke();
      }

      function stopScratch(){
        isDrawing=false;
        ctx.beginPath();
      }

      canvas.addEventListener("mousedown", startScratch);
      canvas.addEventListener("mousemove", drawScratch);
      canvas.addEventListener("mouseup", stopScratch);
      canvas.addEventListener("mouseleave", stopScratch);

      canvas.addEventListener("touchstart", startScratch);
      canvas.addEventListener("touchmove", drawScratch, {passive:false});
      canvas.addEventListener("touchend", stopScratch);
    }

    for(let i=1;i<=12;i++){
      initScratch("scratch"+i, cards[i-1]);
    }
  </script>
</body>
</html>
